        <fieldset>
            <legend class="legend">Let's start talking...</legend>

            <div>
                <label for="name">Your Name</label>
                <input type="text" class="input" name="name" required>
            <br>
            </div>
            <div>
                <label for="mobile_number">Mobile Number</label>

            </div>

                <input type="email" name="email" class="input" id="email" required>
                <br>
            </div>
            <div>
                <label for="reason">Reason for reaching out.</label>
            <select name="reason" class="input" id="reason">
                <option value="discussion">Discussing on new project</option>
                <option value="Error">Error in existing product</option>
                <option value="Job">Job Opportunity</option>
            </select>
            <br>
            </div>
            <div>
            <label for="discussing">Discussion</label>
            <br>
            <textarea name="discussion" class="input" id="discussing">Comments....</textarea>
            </div>
            <div>
            <button type="reset" class="input">reset</button>
            <button type="submit" class="input">submit</button>
            </div>
        </form>
