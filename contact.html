    <main id="main">
         <form id="contact-form-form" type="submit" method="post">
        <fieldset id="contact-form">
       
            <legend class="Legend">Let's start talking...</legend>
            <form type = "submit" method="post"  class="Small-text">
            <div>
                <label for="name" class="Label">Your Name</label>
                <input type="text" class="Input" name="name" id="name" required>
            <br>
            </div>
            <div>
                <label for="mobile-number" class="Label">Mobile Number</label>
                <input type="text" class="Input" name="mobile_number" id="mobile-number" required>
                <br>
            </div>
            <div>
                <label for="email" class="Label">Email</label>
                <input type="email" name="email" class="Input" id="email" required>
                <br>
            </div>
            <div>
                <label for="reason" class="Label">Reason for reaching out.</label>
            <select name="reason" class="Input" id="reason">
                <option value="discussion">Discussing on new project</option>
                <option value="Error">Error in existing product</option>
                <option value="Job">Job Opportunity</option>
            </select>
            <br>
            </div>
            <div>
            <label for="discussing" class="Label">Discussion</label>
            <br>
            <textarea name="discussion" class="Input" id="discussing">Comments....</textarea>
            </div>
            <div>
            <button type="reset" class="Input">reset</button>
            <button type="submit" class="Input">submit</button>
            </div>
        
        </fieldset>
        </form>
        <br><br>
