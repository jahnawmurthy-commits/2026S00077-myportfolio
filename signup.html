<body>
    <form>
        <label for="name"> Your Name</label>

        </select>
        <label for="Age">Your Age</label>
        <input type="text" placeholder="Your Age" id="Age" required pattern="[0-9]{2}">
        <button type="submit">Send</button>
    </form>
</body>
